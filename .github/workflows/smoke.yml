# Read-only checks against the live site (layer 8). Never writes data.
#
# Runs after each push to main (once Cloudflare has had time to deploy it),
# every morning, and by hand. A failure emails whoever GitHub notifies for
# this repository's workflow runs.

name: Live smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 12 * * *' # daily, 6:41 a.m. Central standard time
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://bartrrr.app

concurrency:
  group: smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      SMOKE_URL: ${{ inputs.url || 'https://bartrrr.app' }}
    steps:
      - uses: actions/checkout@v5
      - if: github.event_name == 'push'
        name: Wait for Cloudflare to deploy this commit
        run: sleep 300
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 14
